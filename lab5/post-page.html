<!-- post-page.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POST Request</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <h1>POST Page</h1>
        <nav>
            <ul>
                <li><a href="/home.html">Home</a></li>
                <li><a href="/get-page.html">GET Page</a></li>
                <li><a href="/post-page.html">POST Page</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Send POST request</h2>
            <form id="post-form">
                <label for="post-name">Name:</label>
                <input type="text" id="post-name" name="name" required><br>
                <label for="post-email">Email:</label>
                <input type="email" id="post-email" name="email" required><br>
                <label for="post-message">Message:</label>
                <textarea id="post-message" name="message" required></textarea><br>
                <button type="submit">Send POST</button>
            </form>
            <div id="post-result"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Roman Veskera</p>
    </footer>

    <script src="js/ajax.js"></script>
</body>
</html>
